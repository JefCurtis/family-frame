name: Feature idea
description: Suggest something the dashboard could show or do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like, and who in the household is it for?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else (data source, sketches, similar products)

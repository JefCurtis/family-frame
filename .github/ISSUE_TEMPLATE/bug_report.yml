name: Bug report
description: Something on the dashboard, Worker or kiosk app isn't working.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: device
    attributes:
      label: Frame or browser
      description: Model, Android version and WebView version, or the desktop browser you used.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Please remove tokens, calendar/album links and personal details first.
